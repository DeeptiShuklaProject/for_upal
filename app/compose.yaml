services:
  professor-console:
    build:
      context: .
      dockerfile: Dockerfile
    image: socratic-voice-console:0.2.1
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-45}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      ELEVENLABS_TIMEOUT_SECONDS: ${ELEVENLABS_TIMEOUT_SECONDS:-90}
      ELEVENLABS_VOICE_MARGARET: ${ELEVENLABS_VOICE_MARGARET:-EXAVITQu4vr4xnSDxMaL}
      ELEVENLABS_VOICE_CHRISTOPHER: ${ELEVENLABS_VOICE_CHRISTOPHER:-VR6AewLTigWG4xSOukaG}
      VOICEBOX_BASE_URL: ${VOICEBOX_BASE_URL:-http://host.docker.internal:17493}
      VOICEBOX_PROFILE_ID: ${VOICEBOX_PROFILE_ID:-}
      VOICEBOX_PROFILE_MARGARET: ${VOICEBOX_PROFILE_MARGARET:-}
      VOICEBOX_PROFILE_CHRISTOPHER: ${VOICEBOX_PROFILE_CHRISTOPHER:-}
      VOICEBOX_ENGINE: ${VOICEBOX_ENGINE:-}
      VOICEBOX_MODEL_SIZE: ${VOICEBOX_MODEL_SIZE:-}
      VOICEBOX_LANGUAGE: ${VOICEBOX_LANGUAGE:-en}
      VOICEBOX_TIMEOUT_SECONDS: ${VOICEBOX_TIMEOUT_SECONDS:-180}
      VOICESTUDIO_BASE_URL: ${VOICESTUDIO_BASE_URL:-http://host.docker.internal:3900/v1}
      VOICESTUDIO_API_KEY: ${VOICESTUDIO_API_KEY:-}
      VOICESTUDIO_PIN: ${VOICESTUDIO_PIN:-}
      VOICESTUDIO_MODEL: ${VOICESTUDIO_MODEL:-tts-1}
      VOICESTUDIO_VOICE: ${VOICESTUDIO_VOICE:-}
      VOICESTUDIO_VOICE_MARGARET: ${VOICESTUDIO_VOICE_MARGARET:-}
      VOICESTUDIO_VOICE_CHRISTOPHER: ${VOICESTUDIO_VOICE_CHRISTOPHER:-}
      VOICESTUDIO_TIMEOUT_SECONDS: ${VOICESTUDIO_TIMEOUT_SECONDS:-180}
    stop_grace_period: 20s
